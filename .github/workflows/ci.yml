name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Analyze (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter & Dart SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Temporary pin for custom_lint ^0.8.0 compatibility with analyzer ^8.0.0; see #438 / #439
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      - name: Resolve Workspace Dependencies
        run: dart pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: dart analyze --fatal-infos

      - name: Downgrade Dependencies & Validate Lower Bounds
        run: |
          dart pub downgrade
          dart analyze --fatal-infos
          git checkout -- pubspec.lock
          dart pub get

      - name: Validate Agent Plugin & Skills
        run: dart run tool/validate_agent_plugin.dart

      - name: Run Workspace Tests
        run: dart run tool/run_workspace_tests.dart --coverage

      - name: Enforce Coverage Thresholds
        run: dart run tool/calculate_coverage.dart --min=75 --per-package-min=75
