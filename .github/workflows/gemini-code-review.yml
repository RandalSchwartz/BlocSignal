name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Diff
        id: diff
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          else
            git diff HEAD~1..HEAD > pr_diff.txt
          fi

      - name: Execute Gemini Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              console.log('⚠️ No GEMINI_API_KEY secret configured in repository settings. Skipping automated code review.');
              return;
            }

            const issueNumber = context.issue.number || context.payload.pull_request?.number;
            if (!issueNumber) {
              console.log('No pull request issue number found. Skipping review.');
              return;
            }

            let diff = '';
            try {
              diff = fs.readFileSync('pr_diff.txt', 'utf8');
            } catch (err) {
              console.log('No diff file found:', err.message);
              return;
            }

            if (!diff.trim()) {
              console.log('No diff changes found. Skipping review.');
              return;
            }

            const maxDiffLength = 50000;
            const truncatedDiff = diff.length > maxDiffLength 
              ? diff.substring(0, maxDiffLength) + '\n... (diff truncated)' 
              : diff;

            const prTitle = context.payload.pull_request?.title || 'PR Review';
            const prBody = context.payload.pull_request?.body || 'No description provided.';

            // 1. Ingest AGENTS.md (core developer handbook & repo constitution)
            let agentsContext = '';
            if (fs.existsSync('AGENTS.md')) {
              try {
                agentsContext = fs.readFileSync('AGENTS.md', 'utf8');
                console.log('Loaded AGENTS.md (' + agentsContext.length + ' chars)');
              } catch (e) {
                console.log('Notice: Failed reading AGENTS.md:', e.message);
              }
            }

            // 2. Ingest all public framework skills unconditionally
            const pluginSkillsDir = path.join('plugins', 'bloc-signals', 'skills', 'bloc-signals');
            let skillsContext = '';
            if (fs.existsSync(pluginSkillsDir)) {
              try {
                const skillFiles = fs.readdirSync(pluginSkillsDir).filter(f => f.endsWith('.md')).sort();
                for (const file of skillFiles) {
                  const fullSkillPath = path.join(pluginSkillsDir, file);
                  try {
                    const content = fs.readFileSync(fullSkillPath, 'utf8');
                    skillsContext += '\n\n--- SKILL GUIDANCE: ' + file + ' ---\n' + content;
                    console.log('Loaded framework skill: ' + file + ' (' + content.length + ' chars)');
                  } catch (e) {
                    console.log('Notice: Failed reading skill ' + file + ':', e.message);
                  }
                }
              } catch (e) {
                console.log('Notice: Failed scanning plugin skills directory:', e.message);
              }
            }

            // 3. Scan .agents/skills if referenced in diff
            const repoSkillsDir = path.join('.agents', 'skills');
            if (fs.existsSync(repoSkillsDir)) {
              try {
                const lowerDiff = diff.toLowerCase();
                const subdirs = fs.readdirSync(repoSkillsDir);
                for (const subdir of subdirs) {
                  if (lowerDiff.includes(subdir.toLowerCase())) {
                    const skillMd = path.join(repoSkillsDir, subdir, 'SKILL.md');
                    if (fs.existsSync(skillMd)) {
                      const skillContent = fs.readFileSync(skillMd, 'utf8');
                      skillsContext += '\n\n--- SKILL GUIDANCE: ' + subdir + ' ---\n' + skillContent;
                      console.log('Loaded repo skill: ' + subdir + ' (' + skillContent.length + ' chars)');
                    }
                  }
                }
              } catch (e) {
                console.log('Notice: Failed reading .agents/skills:', e.message);
              }
            }

            const maxContextLength = 500000;
            if (skillsContext.length > maxContextLength) {
              skillsContext = skillsContext.substring(0, maxContextLength) + '\n... (skills context truncated)';
            }

            const prompt = "You are Gemini Code Assist (GCA), an expert automated code reviewer for the BlocSignal Dart and Flutter monorepo.\n\n" +
              (agentsContext ? "=== REPOSITORY CONSTITUTION & DEVELOPER HANDBOOK (AGENTS.md) ===\n" + agentsContext + "\n\n" : "") +
              (skillsContext ? "=== RELEVANT ARCHITECTURAL SKILLS ===\n" + skillsContext + "\n\n" : "") +
              "=== PULL REQUEST DETAILS ===\n" +
              "- PR Title: " + prTitle + "\n" +
              "- PR Description: " + prBody + "\n\n" +
              "Diff:\n" +
              "```diff\n" +
              truncatedDiff + "\n" +
              "```\n\n" +
              "=== REVIEW INSTRUCTIONS ===\n" +
              "Provide a professional, concise code review evaluated strictly against the repository standards and rules above:\n" +
              "1. 🔍 Architectural & Code Analysis:\n" +
              "   - Check adherence to Core Framework Principles (synchronous propagation, streamless execution, constructor ergonomics using named parameter initialState:, inline late final computed properties).\n" +
              "   - Check against known Repository Scars & Crash Defenses in AGENTS.md (for example: avoiding context.watch for state rebuilds, constructor migration patterns, AST visitor closure scoping, Dart 3.13 syntax vs SDK 3.5 package compatibility).\n" +
              "2. 🧪 Test Coverage & Code Quality:\n" +
              "   - Verify 100% line coverage requirement across packages.\n" +
              "   - Check declarative testing standards using blocSignalTest.\n" +
              "   - Ensure all public APIs have comprehensive doc comments (///) with runnable examples.\n" +
              "   - Phrasing standard check: Strictly verify no usage of 'e.g.' (must write 'for example') or 'i.e.' (must write 'that is') in documentation or comments.\n" +
              "3. 🎯 GCA Recommendation:\n" +
              "   - Explicit recommendation tag: 🟢 APPROVE or 🟡 REQUEST CHANGES.\n\n" +
              "Format your response in clean GitHub Markdown with headings, bullet points, and an explicit GCA approval status tag.";

            const candidateModels = [
              'gemini-3.8-flash',
              'gemini-2.5-flash',
              'gemini-2.0-flash',
              'gemini-1.5-flash-002'
            ];
            let response;
            let reviewText = null;

            for (const model of candidateModels) {
              const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + apiKey;
              console.log('Querying Gemini API (' + model + ')...');
              try {
                const res = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                  })
                });

                if (res.ok) {
                  const data = await res.json();
                  reviewText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                  if (reviewText) {
                    response = res;
                    break;
                  }
                } else {
                  const errBody = await res.text();
                  console.log('Model ' + model + ' returned HTTP ' + res.status + ': ' + errBody);
                }
              } catch (e) {
                console.log('Fetch error for model ' + model + ':', e.message);
              }
            }

            if (!response || !response.ok || !reviewText) {
              const errText = response ? await response.text() : 'No response';
              console.log('⚠️ Gemini API Review Notice (' + (response ? response.status : 'error') + '):\n' + errText);
              console.log('Please verify GEMINI_API_KEY permissions in Google AI Studio / GCP Console.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '🤖 **Gemini Code Assist (GCA) Automated Review**\n\n' + reviewText
            });
            console.log('✅ Successfully posted automated code review to PR #' + issueNumber);
