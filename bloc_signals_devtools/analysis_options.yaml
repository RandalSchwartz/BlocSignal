include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - example/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - async_return_with_no_await
    - empty_container_bodies
    - initialize_in_field_declaration
    - unnecessary_const_in_enum_constructor
