<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlocSignal — The Rigor of BLoC. The Flex & Speed of Signal.</title>
  <meta name="description" content="Enterprise-grade state management for Dart & Flutter with 0ms microtask latency, 100% docstring coverage, OpenTelemetry tracing, and universal ecosystem bridges.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Google Analytics (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-34LKXX2GN0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-34LKXX2GN0');

    window.trackGaPageView = function(path) {
      if (typeof gtag === 'function') {
        gtag('event', 'page_view', {
          'page_path': path,
          'page_title': document.title
        });
      }
    };

    window.trackMinesweeperEvent = function(eventName, difficulty, val) {
      if (typeof gtag === 'function') {
        gtag('event', eventName, {
          'event_category': 'Minesweeper',
          'difficulty': difficulty || 'Beginner',
          'value': val || 0
        });
      }
    };
  </script>
  <script defer src="main.dart.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
