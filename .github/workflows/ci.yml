name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Analyze (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter & Dart SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Resolve Workspace Dependencies
        run: dart pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: dart analyze --fatal-infos

      - name: Validate Agent Plugin & Skills
        run: dart run tool/validate_agent_plugin.dart

      - name: Run Workspace Tests
        run: dart run tool/run_workspace_tests.dart
