name: genui_flight_booking
description: Interactive Flutter reference application showcasing Generative UI with A2UI and BlocSignal.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  a2ui_core: ^0.1.1
  bloc_signals: ^1.4.0
  bloc_signals_flutter: ^1.0.0
  bloc_signals_genui: ^0.1.0
  bloc_signals_genui_flutter: ^0.1.0
  flutter:
    sdk: flutter
  signals_flutter: ^7.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
